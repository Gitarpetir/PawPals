services:
  - type: web
    name: pawpals-server
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PawPals__RequirePostgres
        value: "true"
      - key: DATABASE_URL
        sync: false
